<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mrittunjay Dubey | B.Tech CSE, Fintech Honors | Portfolio</title>
    <meta name="description" content="Mrittunjay Dubey: B.Tech CSE (Fintech Honors) at SRM IST, class of 2028. AI, backend and fintech projects, resume and contact." />
    <meta name="theme-color" content="#0b0d10" />
    <!-- Applies a saved daylight edition before the page paints, so it never flashes dark first. -->
    <script>
      try {
        if (localStorage.getItem('edition') === 'day') document.documentElement.dataset.edition = 'day'
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Loads the first-screen fonts early so the cover doesn't jump when they arrive. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/bangers/files/bangers-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mrittunjay Dubey" />
    <meta property="og:title" content="Mrittunjay Dubey | Portfolio" />
    <meta property="og:description" content="B.Tech CSE (Fintech Honors) at SRM IST, class of 2028. AI, backend and fintech projects, resume and contact." />
    <!-- The site address placeholder below is filled in at build time by vite.config.ts. -->
    <meta property="og:url" content="__SITE_URL__/" />
    <!-- A JPEG under 300 KB: WhatsApp skips larger preview images. -->
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Comic-book cover with the name Mrittunjay Dubey, B.Tech CSE with Fintech Honors at SRM IST, over a night city skyline." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mrittunjay Dubey | Portfolio" />
    <meta name="twitter:description" content="B.Tech CSE (Fintech Honors) at SRM IST, class of 2028. AI, backend and fintech projects, resume and contact." />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
